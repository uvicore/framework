[project]
name = "uvicore"
version = "0.4.13"
description = "The Fullstack Async Web, API and CLI Python Framework"
authors = [
    {name = "Matthew Reschke", email = "mail@mreschke.com"}
]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Web Environment",
    "Environment :: Console",
    "Framework :: AnyIO",
    "Framework :: FastAPI",
    "Framework :: Pydantic",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Topic :: Internet",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]

# Required base dependencies
# Hard-pinned to exact latest versions on 2026-10-26
dependencies = [
    "anyio==4.15.1",
    "prettyprinter==0.18.0",

    # Rich powers all pretty STDOUT/STDERR console logging (uvicore.log).
    # Part of the base install (NOT gated behind web/database/redis extras) so
    # console output is beautiful for every uvicore app, CLI included.
    # Rich replaced the old `colored`-based ColoredFormatter (colored removed).
    "rich==15.0.0",
    "environs==15.2.0",
    "argon2-cffi==25.1.0",
    "cryptography==50.0.2",
    "merge-args==0.1.5",

    # Templating is part of core, not just web, so include it in base
    "jinja2==3.1.6",

    # Upgraded to Pydantic v2 (2026-06-19) to allow modern FastAPI/Starlette.
    # FastAPI dropped Pydantic v1 in 0.126.0 and removed the v1 shim in 0.128.0.
    "pydantic==2.14.1",

    # Uvicore's async HTTP client (runtime http_client service + mail backends)
    # AND the in-process ASGI test client in conftest.py. conftest now uses the
    # modern AsyncClient(transport=ASGITransport(app=...)) API, so we are no
    # longer held back to 0.26 by the removed app= shortcut.
    # Future: starlette.testclient nudges toward the httpx2 package, but only
    # matters if we adopt starlette's TestClient (we use httpx.AsyncClient direct).
    "httpx==0.28.1",

    # NOTICE: Everything below this line is a TRANSITIVE subdependency of my actual
    # requirements above.  They are hard-pinned here so the entire dependency tree
    # is frozen into the published package metadata (Requires-Dist), because
    # poetry.lock is NOT shipped to PyPI and is NOT consulted by `pip install
    # uvicore[...]` — without these pins a user's subdependencies could drift.
    #
    # Generated by ./list-subdependencies.sh (derives the omit-list from the
    # top-level deps above + reads resolved versions/markers from poetry.lock).
    # Regenerate after any dependency upgrade: `poetry run ./list-subdependencies.sh`
    # Environment markers are preserved so conditional deps stay conditional
    # (e.g. hiredis only with the redis extra, colorama only on Windows).
    # Last regenerated 2026-10-26 (full upgrade for the emSign CA incident: certifi>=2026.10.19).
    "annotated-doc==0.0.5 ; extra == 'web'",
    "annotated-types==0.8.0",
    "argon2-cffi-bindings==26.1.0",
    "certifi==2026.10.23",
    "cffi==2.1.1",
    "click==8.5.0 ; extra == 'web'",
    "colorama==0.4.6 ; platform_system == 'Windows'",
    "colorful==0.5.8",
    "greenlet==3.5.6 ; extra == 'database' and (platform_machine == 'aarch64' or platform_machine == 'ppc64le' or platform_machine == 'x86_64' or platform_machine == 'amd64' or platform_machine == 'AMD64' or platform_machine == 'win32' or platform_machine == 'WIN32')",
    "h11==0.16.0",
    "hiredis==3.5.0 ; extra == 'redis'",
    "httpcore==1.0.9",
    "idna==3.20",
    "mako==1.4.3 ; extra == 'database'",
    "markdown-it-py==4.2.0",
    "markupsafe==3.0.4",
    "marshmallow==4.3.1",
    "mdurl==0.1.2",
    "opentelemetry-api==1.45.1 ; extra == 'web'",
    "packaging==26.3 ; extra == 'web'",
    "pycparser==3.12 ; implementation_name != 'PyPy'",
    "pydantic-core==2.50.1",
    "pygments==2.21.0",
    "pymysql==1.2.3 ; extra == 'database'",
    "python-dotenv==1.2.4",
    "typing-extensions==4.16.0",
    "typing-inspection==0.4.4",
]

# Optional extra dependencies
# poetry install --extras "database redis web"
# poetry install --extras "database redis web" --with test
[project.optional-dependencies]

# Optional database deps upgraded to latest versions on 2026-10-26
database = [
    "sqlalchemy==2.1.6",
    "alembic==1.20.1",
    "aiomysql==0.3.2",
    "aiosqlite==0.22.1",
    "asyncpg==0.32.0",
]

# Optional Redis deps upgraded to latest versions on 2026-10-26
redis = [
    "redis[hiredis]==8.1.0",
]

# Optional web deps upgraded to latest versions on 2026-10-26
web = [
    "starlette==1.10.0",
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "gunicorn==26.2.0",
    "aiofiles==25.1.0",
    "itsdangerous==2.2.0",  # required by starlette's SessionMiddleware (already latest)
    "uvloop==0.23.0",       # picked up automatically by uvicorn for performance
    "httptools==0.9.0",     # picked up automatically by uvicorn for HTTP parsing
    "python-multipart==0.0.32",  # required by starlette/fastapi for Form/File parsing
    "pyjwt==2.15.1"
]

[project.urls]
Homepage = "https://github.com/uvicore/framework"
Repository = "https://github.com/uvicore/framework"
Documentation = "https://github.com/uvicore/framework"

# Optional unittest dependencies (a poetry-native dependency group, not a PEP 621
# extra): poetry install --extras "database redis web" --with test
# Test deps upgraded to exact latest versions on 2026-10-26
[tool.poetry.group.test.dependencies]
pytest = "9.1.1"
pytest-cov = "7.1.0"
pytest-asyncio = "1.4.1"

# pytest-asyncio 1.x removed the custom `event_loop` fixture override that this
# suite used to run everything on a single session loop.  The whole suite is
# designed around session-scoped fixtures (app1, client) that open DB/redis
# connections bound to one loop, so pin BOTH fixtures and tests to the session
# loop scope to reproduce the old single-loop behavior.  Without this, tests
# run on per-function loops while the connections live on the session loop,
# giving "Future attached to a different loop" / "Event loop is closed".
[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[build-system]
requires = ["poetry-core>=2.1.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
